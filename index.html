<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>One More Thing Class Trial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,700..900,100,1&family=Inter+Tight:wght@400;600;800;900&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050505;--panel:#111;--panel2:#171717;--text:#f4f4f0;--muted:#8e8e86;--line:rgba(255,255,255,.13);--soft:rgba(255,255,255,.045);--accent:#f4f4f0;--danger:#ff6b63;
      --header:68px;--footer:72px;--rail:280px;--gap:12px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Inter Tight',Arial,Helvetica,sans-serif;overscroll-behavior:none;overflow:hidden}
    button,input,textarea,select{font:inherit;color:inherit}
    button{cursor:pointer;border:0;background:none}
    .mono,.small,.label,.pill,.footer-button,.nav-btn{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.11em;font-size:12px;color:var(--muted);line-height:1.35}
    .logo{font-family:'Fraunces',serif;font-weight:900;font-variation-settings:'WONK' 1,'SOFT' 100;letter-spacing:-.12em;line-height:.72;text-transform:uppercase}
    .launch{position:fixed;inset:0;background:#050505;z-index:99999;display:grid;place-items:center;transition:opacity .7s ease,visibility .7s ease}
    .launch.hide{opacity:0;visibility:hidden;pointer-events:none}
    .launch-logo{font-size:clamp(82px,18vw,240px);text-align:center;max-width:900px}
    .app{height:100dvh;display:grid;grid-template-columns:1fr var(--rail);grid-template-rows:var(--header) 1fr var(--footer);gap:var(--gap);padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));}
    header{grid-column:1/3;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px;min-width:0}
    .brand-logo{font-size:clamp(32px,4.8vw,68px);white-space:nowrap}
    .brand-logo span{display:block}
    .status{text-align:right;padding-top:6px}
    main{grid-column:1;grid-row:2;min-height:0;display:grid}
    .stack-rail{grid-column:2;grid-row:2/4;min-height:0;border:1px solid var(--line);background:linear-gradient(180deg,rgba(20,20,20,.92),rgba(8,8,8,.94));display:grid;grid-template-rows:auto 1fr auto;padding:14px;gap:12px;overflow:hidden}
    footer{grid-column:1;grid-row:3;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}
    .footer-button,.nav-btn{border:1px solid var(--line);background:rgba(17,17,17,.82);border-radius:0;padding:14px 10px;color:var(--text);min-height:48px}
    .footer-button.primary{background:var(--accent);color:#050505;border-color:var(--accent);font-weight:700}
    .thing-card{min-height:0;border:1px solid var(--line);background:linear-gradient(180deg,rgba(22,22,22,.94),rgba(8,8,8,.96));box-shadow:0 28px 90px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.035);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
    .thing-top{padding:clamp(28px,4vw,54px) clamp(24px,4vw,54px) 18px;min-width:0}
    .thing-title{font-size:clamp(68px,8.5vw,164px);line-height:.82;letter-spacing:-.095em;font-weight:900;word-break:break-word;margin-top:24px;max-width:1200px}
    .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
    .pill{border:1px solid var(--line);background:rgba(255,255,255,.025);padding:8px 12px;color:var(--muted)}
    .thing-scroll{min-height:0;overflow:auto;padding:0 clamp(24px,4vw,54px) 24px;scrollbar-width:none}
    .thing-scroll::-webkit-scrollbar{display:none}
    .thing-body{font-size:clamp(18px,1.65vw,30px);line-height:1.35;max-width:900px;white-space:pre-wrap;color:rgba(244,244,240,.82);margin:10px 0 22px}
    .thing-image{width:min(100%,980px);max-height:44vh;object-fit:cover;border:1px solid var(--line);display:block;margin:0 0 24px;background:#111}
    .thing-link-preview{display:block;width:min(100%,980px);border:1px solid var(--line);background:rgba(255,255,255,.035);padding:16px;margin:0 0 24px;color:var(--text);text-decoration:none}
    .thing-link-preview strong{display:block;font-size:clamp(18px,2vw,30px);letter-spacing:-.04em;line-height:1.05;margin-bottom:8px}
    .thing-link-preview span{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;word-break:break-all}

    .thing-actions{display:grid;grid-template-columns:1.4fr .8fr .8fr .8fr;gap:10px;padding:0 clamp(24px,4vw,54px) clamp(22px,3vw,36px)}
    .button{border:1px solid var(--accent);background:var(--accent);color:var(--bg);border-radius:0;padding:16px 18px;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;min-height:54px;font-size:14px}
    .button.secondary{background:rgba(0,0,0,.16);color:var(--text);border-color:var(--line)}
    .button.danger{color:var(--danger);border-color:rgba(255,107,99,.35);background:rgba(255,107,99,.06)}
    .stack-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:10px}
    .stack-title{font-size:clamp(28px,3vw,46px);font-weight:900;letter-spacing:-.075em;line-height:.9;text-transform:uppercase}
    .stack-list{min-height:0;overflow:auto;display:grid;gap:8px;padding-right:2px;scroll-snap-type:y proximity;scrollbar-width:none}
    .stack-list::-webkit-scrollbar{display:none}
    .stack-item{border:1px solid var(--line);background:rgba(255,255,255,.03);padding:12px;min-height:78px;display:grid;align-content:space-between;scroll-snap-align:start;cursor:pointer;transition:background .18s,transform .18s}
    .stack-item:hover{background:rgba(255,255,255,.07)}
    .stack-item.active{background:var(--accent);color:var(--bg)}
    .stack-item.active .small{color:#222}
    .stack-name{font-weight:800;line-height:1.05;font-size:16px;letter-spacing:-.025em}
    .stack-cats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .chip{border:1px solid var(--line);padding:8px 7px;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:rgba(0,0,0,.12)}
    .chip.active{background:var(--accent);color:#050505;border-color:var(--accent)}
    dialog{width:min(780px,calc(100vw - 24px));border:1px solid var(--line);background:linear-gradient(180deg,rgba(23,23,23,.98),rgba(8,8,8,.98));color:var(--text);border-radius:0;padding:0;box-shadow:0 30px 120px rgba(0,0,0,.65)}
    dialog::backdrop{background:rgba(0,0,0,.76);backdrop-filter:blur(8px)}
    .modal{padding:18px;display:grid;gap:12px;max-height:92dvh;overflow:auto}
    .modal-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
    .modal-title{font-size:34px;font-weight:900;letter-spacing:-.065em;text-transform:uppercase;margin:0}
    .icon-button{width:46px;height:46px;border:1px solid var(--line);display:grid;place-items:center;font-size:28px;color:var(--text)}
    input,textarea,select{width:100%;background:#090909;border:1px solid var(--line);border-radius:0;padding:14px;outline:none;color:var(--text)}
    textarea{min-height:150px;resize:vertical}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .list{display:grid;gap:8px;max-height:60dvh;overflow:auto}
    .list-item{border:1px solid var(--line);padding:14px;background:rgba(255,255,255,.025);display:grid;gap:6px;cursor:pointer}
    .calendar-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
    .day{min-height:78px;border:1px solid var(--line);padding:7px;background:rgba(255,255,255,.02);display:grid;align-content:start;gap:4px}
    .day.out{opacity:.25}.day-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}.dot{height:5px;background:var(--accent);opacity:.75}
    #timerDialog{width:min(760px,calc(100vw - 24px));height:min(92dvh,980px);overflow:hidden}
    .timer-modal{height:100%;padding:clamp(12px,2.2dvh,24px) clamp(14px,3vw,20px);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:clamp(6px,1.2dvh,14px);text-align:center;overflow:hidden}
    .timer-spin-title{font-size:clamp(42px,10dvh,112px);font-weight:900;letter-spacing:-.095em;line-height:1.05}.timer-spin-sub{font-size:clamp(20px,4.2dvh,46px);font-weight:300;letter-spacing:-.06em;color:var(--muted);line-height:.9}.timer-end{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.035);border:1px solid var(--line);padding:10px 16px;color:var(--text);font-size:clamp(14px,2.6dvh,24px);margin-top:clamp(8px,1.4dvh,14px)}
    .timer-scale{position:relative;width:min(72vw,38dvh,500px);aspect-ratio:1/1;display:grid;place-items:center;margin:0 auto;flex:0 1 auto}.timer-ring{position:absolute;inset:9%;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.92) 0 42%,rgba(30,30,30,.92) 43% 100%);border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 70px rgba(0,0,0,.65);touch-action:none;cursor:grab}.timer-ticks{position:absolute;inset:0;border-radius:50%;pointer-events:none;transform-origin:50% 50%}.tick{position:absolute;left:50%;top:50%;width:3px;height:16px;background:rgba(244,244,240,.82);border-radius:99px;transform-origin:center center}.tick.major{opacity:0}.timer-number{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:clamp(58px,12dvh,132px);font-weight:900;letter-spacing:-.1em;line-height:.8}.timer-number span{display:block;font-size:clamp(13px,2.4dvh,24px);letter-spacing:-.02em;color:var(--muted);margin-top:8px}.scale-label{position:absolute;color:var(--muted);font-size:clamp(20px,5vw,34px);line-height:1.05;z-index:5;text-align:center;background:rgba(17,17,17,.92);padding:4px 8px}.scale-label small{display:block;font-size:.52em;margin-top:2px}.scale-0{top:0;left:50%;transform:translateX(-50%)}.scale-30{right:0;top:50%;transform:translateY(-50%)}.scale-60{bottom:0;left:50%;transform:translateX(-50%)}.scale-90{left:0;top:50%;transform:translateY(-50%)}.increment-pill{color:var(--muted);border:1px solid var(--line);padding:8px 14px;text-transform:uppercase;letter-spacing:.12em;font-family:'IBM Plex Mono';font-size:clamp(10px,1.6dvh,12px)}
    .timer-lock{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:none;place-items:center;text-align:center;padding:24px;backdrop-filter:blur(4px)}.lock-inner{display:grid;gap:22px;width:min(720px,100%)}.lock-time{font-size:clamp(96px,28vw,210px);font-weight:900;letter-spacing:-.11em;line-height:.8}.lock-task{font-size:clamp(34px,9vw,78px);font-weight:900;letter-spacing:-.08em;line-height:.95}
    @media(max-width:820px){:root{--header:80px;--footer:72px}.app{grid-template-columns:1fr;grid-template-rows:var(--header) 1fr 118px var(--footer);padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}.brand-logo{font-size:clamp(42px,12vw,72px)}header{grid-column:1}.status{font-size:11px}.stack-rail{grid-column:1;grid-row:3;padding:10px;display:grid;grid-template-columns:140px 1fr;grid-template-rows:1fr;gap:10px}.stack-head{border-bottom:0;border-right:1px solid var(--line);padding:0 10px 0 0;display:grid}.stack-title{font-size:26px}.stack-cats{grid-template-columns:1fr}.stack-list{display:flex;overflow-x:auto;overflow-y:hidden}.stack-item{min-width:170px;min-height:92px}.thing-card{grid-template-rows:auto 1fr auto}.thing-top{padding:28px 22px 12px}.thing-title{font-size:clamp(58px,17vw,122px)}.thing-actions{grid-template-columns:1fr;gap:10px;padding:0 22px 20px}.button{min-height:58px;font-size:15px}.form-grid{grid-template-columns:1fr}.day{min-height:58px;padding:5px}.footer-button{font-size:11px;padding:12px 4px}footer{grid-column:1;grid-row:4}.thing-body{font-size:clamp(17px,4.8vw,22px)}}
  </style>
</head>
<body>
  <div class="launch" id="launch"><div class="logo launch-logo">ONE<br>MORE<br>THING</div></div>
  <div class="app">
    <header><div class="logo brand-logo">ONE<br>MORE<br>THING</div><div class="status small" id="status">SYNCING</div></header>
    <main id="main"></main>
    <aside class="stack-rail"><div class="stack-head"><div><div class="small">Stack</div><div class="stack-title" id="stackTitle">All</div></div><div class="small" id="stackCount">0 Things</div></div><div class="stack-list" id="stackList"></div><div class="stack-cats" id="categoryChips"></div></aside>
    <footer><button class="footer-button" id="libraryBtn">Library</button><button class="footer-button primary" id="addBtn">Add Thing</button><button class="footer-button" id="calendarBtn">Calendar</button><button class="footer-button" id="categoriesBtn">Stacks</button></footer>
  </div>
  <dialog id="editorDialog"><form method="dialog" class="modal" id="editorForm"><div class="modal-head"><h2 class="modal-title" id="editorTitle">Add Thing</h2><button class="icon-button" type="button" data-close="editorDialog">×</button></div><label><div class="field-label">Thing</div><textarea id="thingText" placeholder="First sentence becomes the header. Everything after becomes body copy."></textarea></label><div class="form-grid"><label><div class="field-label">Stack</div><select id="thingCategory"></select></label><label><div class="field-label">Date</div><input id="thingDate" type="date"></label></div><label><div class="field-label">Image URL</div><input id="thingImage" type="url" placeholder="https://..."></label><label><div class="field-label">Article / Link URL</div><input id="thingLink" type="url" placeholder="https://..."></label><div class="form-grid"><button class="button" id="saveThingBtn" type="button">Save Thing</button><button class="button secondary" id="hideThingBtn" type="button">Hide Thing</button></div><button class="button danger" id="deleteThingBtn" type="button">Delete Thing</button></form></dialog>
  <dialog id="libraryDialog"><div class="modal"><div class="modal-head"><h2 class="modal-title">Library</h2><button class="icon-button" type="button" data-close="libraryDialog">×</button></div><div class="list" id="libraryList"></div></div></dialog>
  <dialog id="categoriesDialog"><div class="modal"><div class="modal-head"><h2 class="modal-title">Stacks</h2><button class="icon-button" type="button" data-close="categoriesDialog">×</button></div><div class="form-grid"><input id="newCategoryInput" placeholder="New stack name"><button class="button" id="addCategoryBtn" type="button">Add</button></div><div class="list" id="categoriesList"></div></div></dialog>
  <dialog id="calendarDialog"><div class="modal"><div class="modal-head"><h2 class="modal-title">Calendar</h2><button class="icon-button" type="button" data-close="calendarDialog">×</button></div><div class="calendar-top"><button class="nav-btn" id="prevMonthBtn">Prev</button><div class="stack-title" id="monthTitle"></div><button class="nav-btn" id="nextMonthBtn">Next</button></div><div class="stack-cats" id="calendarFilters"></div><div class="calendar-grid" id="calendarGrid"></div></div></dialog>
  <dialog id="timerDialog"><div class="timer-modal"><div style="width:100%;display:flex;justify-content:flex-start"><button class="icon-button" type="button" id="closeTimerBtn">×</button></div><div><div class="small">Set focus time</div><div class="timer-spin-title">Spin</div><div class="timer-spin-sub">to set time</div><div class="timer-end">◷ <span id="timerEndText">Ends in 30 min</span></div></div><div class="timer-scale"><div class="scale-label scale-0">0<small>min</small></div><div class="scale-label scale-30">30<small>min</small></div><div class="scale-label scale-60">60<small>min</small></div><div class="scale-label scale-90">90<small>min</small></div><div class="timer-ring" id="timerRing"><div class="timer-ticks" id="timerTicks"></div><div class="timer-number"><div><div id="timerValue">30</div><span>min</span></div></div></div></div><div class="increment-pill">In increments of 5 min</div><button class="button" style="width:100%" id="startTimerBtn" type="button">Continue</button></div></dialog>
  <div class="timer-lock" id="timerLock"><div class="lock-inner"><div class="small">Focus lock</div><div class="lock-time" id="lockTime">00:00</div><div class="lock-task" id="lockTask">Focus</div><div class="thing-body" style="margin:auto">The app is locked until the timer finishes. Stay with this one thing.</div></div></div>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
  const firebaseConfig = { apiKey: 'AIzaSyBPvYl7yv2v0qKueEKAQbDbibiL6DsMYDY', authDomain: 'one-thing-4c240.firebaseapp.com', projectId: 'one-thing-4c240', storageBucket: 'one-thing-4c240.firebasestorage.app', messagingSenderId: '222403854731', appId: '1:222403854731:web:e8f45fed2489dca245af8e' };
  const app = initializeApp(firebaseConfig); const db = getFirestore(app);
  const catsDefault=['ADD306','ADD105','ADT201','RESEARCH','PERSONAL','CREATIVE'];
  let things=[], categories=[], activeCategory='ADD306', editing=null, selectedThing=null, selectedMinutes=30, monthCursor=new Date(), timerEnd=Number(localStorage.getItem('omtTimerEnd')||0), timerTitle=localStorage.getItem('omtTimerTitle')||'', timerInterval=null, audioContext=null, lastTick=0;
  let stackCursor={}; try{stackCursor=JSON.parse(localStorage.getItem('omtStackCursor')||'{}')}catch(_){stackCursor={}}
  const $=id=>document.getElementById(id); const main=$('main'), status=$('status'), stackList=$('stackList'), categoryChips=$('categoryChips'), stackTitle=$('stackTitle'), stackCount=$('stackCount');
  const editorDialog=$('editorDialog'), libraryDialog=$('libraryDialog'), categoriesDialog=$('categoriesDialog'), calendarDialog=$('calendarDialog'), timerDialog=$('timerDialog');
  const thingText=$('thingText'), thingCategory=$('thingCategory'), thingDate=$('thingDate'), thingImage=$('thingImage'), thingLink=$('thingLink');
  const timerRing=$('timerRing'), timerTicks=$('timerTicks'), timerValue=$('timerValue'), timerEndText=$('timerEndText'), timerLock=$('timerLock'), lockTime=$('lockTime'), lockTask=$('lockTask');
  setTimeout(()=>$('launch').classList.add('hide'),900);
  function splitText(text){const clean=String(text||'').trim(); if(!clean)return{heading:'Untitled Thing',body:''}; const markers=['. ','! ','? ','\n']; let positions=markers.map(m=>clean.indexOf(m)).filter(i=>i>-1); if(!positions.length)return{heading:clean,body:''}; const i=Math.min(...positions); return{heading:clean.slice(0,i+1).replace(/[.!?]$/,'').trim()||clean,body:clean.slice(i+1).trim()}}
  function thingStack(t){return t.stack||t.category||''}
  function activeThingsInStack(stackName){return things.filter(t=>!t.hidden&&!t.done&&!t.parked&&thingStack(t)===stackName).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))}
  function visibleThings(){ensureActiveCategory();return activeThingsInStack(activeCategory)}
  function saveCursor(){localStorage.setItem('omtStackCursor',JSON.stringify(stackCursor))}
  function currentIndex(){var list=visibleThings();if(!list.length)return 0;var index=Number(stackCursor[activeCategory]||0);if(index<0)index=0;if(index>=list.length)index=list.length-1;stackCursor[activeCategory]=index;saveCursor();return index}
  function currentThing(){var list=visibleThings();return list[currentIndex()]||null}
  function moveThing(direction){var list=visibleThings();if(!list.length)return;var index=currentIndex();index=(index+direction+list.length)%list.length;stackCursor[activeCategory]=index;saveCursor();render()}
  function ensureActiveCategory(){const cats=allCats();if(!cats.includes(activeCategory))activeCategory=cats[0]||'ADD306'}
  function allCats(){const base=categories.length?categories.map(c=>c.name).filter(Boolean):catsDefault;return [...new Set([...base,...things.map(t=>thingStack(t)).filter(Boolean)])]}
  function thingDoc(id){return doc(db,'tasks',id)}
  async function updateThing(t,patch){if(!t.firebaseId)return;await updateDoc(thingDoc(t.firebaseId),patch)}
  async function deleteThing(t){if(t.firebaseId)await deleteDoc(thingDoc(t.firebaseId))}
  async function seedCategories(){for(const name of catsDefault){await setDoc(doc(db,'categories',name),{name:name,createdAt:Date.now()},{merge:true})}}
  onSnapshot(collection(db,'tasks'),snap=>{things=snap.docs.map(d=>({firebaseId:d.id,...d.data()}));status.innerHTML='LIVE<br>'+things.length+' THINGS';render()});
  onSnapshot(collection(db,'categories'),snap=>{categories=snap.docs.map(d=>({firebaseId:d.id,...d.data()}));if(!categories.length){seedCategories();return}renderCategoriesUI();render()});
  function render(){ensureActiveCategory();renderCategoryChips();renderMain();renderStack();renderLibrary();renderCalendar();}
  function renderCategoryChips(){ensureActiveCategory();categoryChips.innerHTML='';allCats().forEach(c=>{const count=activeThingsInStack(c).length;const b=document.createElement('button');b.className='chip '+(activeCategory===c?'active':'');b.textContent=c+' '+count;b.onclick=()=>{activeCategory=c;render()};categoryChips.appendChild(b)});stackTitle.textContent=activeCategory;stackCount.textContent=visibleThings().length+' Active'}
  function renderMain(){main.innerHTML='';const t=currentThing(); if(!t){const card=document.createElement('section');card.className='thing-card empty';card.innerHTML='<div><strong>NOTHING IN '+activeCategory+'</strong><div class="note">Add a Thing to this Stack, or open Library to view done, parked, hidden, and archived Things.</div></div>';main.appendChild(card);return} const parts=splitText(t.note||t.title);const card=document.createElement('section');card.className='thing-card';card.id='focusCard';const top=document.createElement('div');top.className='thing-top';top.innerHTML='<div class="small">'+greeting()+'</div><div class="thing-title"></div><div class="pills"></div>';top.querySelector('.thing-title').textContent=parts.heading;const pills=top.querySelector('.pills');[t.category||'WORK','NOW','ONE MORE THING',(t.timer||30)+' MIN'].forEach(p=>addPill(pills,p));if(t.date)addPill(pills,t.date);const scroll=document.createElement('div');scroll.className='thing-scroll';if(t.image){const img=document.createElement('img');img.className='thing-image';img.src=t.image;img.alt='Thing image';scroll.appendChild(img)}if(t.link){const a=document.createElement('a');a.className='thing-link-preview';a.href=t.link;a.target='_blank';a.rel='noopener';let host=t.link;try{host=new URL(t.link).hostname.replace('www.','')}catch(_){ }a.innerHTML='<strong>Open article / resource</strong><span>'+host+'</span>';scroll.appendChild(a)}const body=document.createElement('div');body.className='thing-body';body.textContent=parts.body||'Stay with this one thing.';scroll.appendChild(body);const actions=document.createElement('div');actions.className='thing-actions';actions.appendChild(button('Done','button',async()=>{t.done=true;t.parked=false;t.completedAt=Date.now();render();await updateThing(t,{done:true,completedAt:t.completedAt,parked:false})}));actions.appendChild(button('Next','button secondary',()=>moveThing(1)));actions.appendChild(button('Timer','button secondary',()=>openTimer(t)));actions.appendChild(button('Edit','button secondary',()=>openEditor(t)));card.append(top,scroll,actions);main.appendChild(card);attachSwipe(t)}
  function renderStack(){stackList.innerHTML='';var selected=currentIndex();visibleThings().forEach((t,i)=>{const p=splitText(t.note||t.title);const item=document.createElement('div');item.className='stack-item '+(i===selected?'active':'');item.innerHTML='<div class="stack-name"></div><div class="small"></div>';item.querySelector('.stack-name').textContent=p.heading;item.querySelector('.small').textContent=activeCategory+' / '+(t.timer||30)+' MIN';item.onclick=()=>{stackCursor[activeCategory]=i;saveCursor();render()};stackList.appendChild(item)})}
  function renderLibrary(){const list=$('libraryList'); if(!list)return; list.innerHTML='';things.slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach(t=>{const p=splitText(t.note||t.title);const item=document.createElement('div');item.className='list-item';item.innerHTML='<strong></strong><span class="small"></span>';item.querySelector('strong').textContent=(t.hidden?'🔒 ':t.done?'✓ ':'')+p.heading;item.querySelector('span').textContent=(thingStack(t)||'NO STACK')+' / '+(t.done?'DONE':t.hidden?'HIDDEN':t.parked?'PARKED':'ACTIVE')+' / tap to edit';item.onclick=()=>openEditor(t);list.appendChild(item)})}
  function renderCategoriesUI(){thingCategory.innerHTML='';allCats().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;thingCategory.appendChild(o)}); const list=$('categoriesList'); if(!list)return; list.innerHTML='';allCats().forEach(c=>{const item=document.createElement('div');item.className='list-item';item.innerHTML='<strong>'+c+'</strong><span class="small">tap to rename stack · double tap to delete</span>';item.onclick=async()=>{const proposed=prompt('Rename stack',c);if(!proposed)return;const name=proposed.trim().toUpperCase();if(!name||name===c)return;try{let found=categories.find(x=>x.name===c);if(found){await updateDoc(doc(db,'categories',found.firebaseId),{name:name,updatedAt:Date.now()})}else{await setDoc(doc(db,'categories',name),{name:name,createdAt:Date.now()},{merge:true})}await Promise.all(things.filter(t=>t.category===c).map(t=>updateThing(t,{category:name})));if(activeCategory===c)activeCategory=name;renderCategoriesUI();render()}catch(error){console.error(error);alert('Could not rename stack. Check your Firestore rules allow writes to categories.')}};item.ondblclick=async()=>{if(!confirm('Delete stack? Things stay but move to WORK.'))return;try{let found=categories.find(x=>x.name===c);if(found)await deleteDoc(doc(db,'categories',found.firebaseId));await Promise.all(things.filter(t=>t.category===c).map(t=>updateThing(t,{category:'WORK'})));if(activeCategory===c)activeCategory=allCats()[0]||'ADD306';renderCategoriesUI();render()}catch(error){console.error(error);alert('Could not delete stack. Check your Firestore rules allow writes to categories.')}};item.oncontextmenu=e=>{e.preventDefault();item.ondblclick()};list.appendChild(item)})}
    function renderCalendar(){const grid=$('calendarGrid'); if(!grid)return; grid.innerHTML=''; const y=monthCursor.getFullYear(), m=monthCursor.getMonth(); $('monthTitle').textContent=monthCursor.toLocaleString('en-AU',{month:'long',year:'numeric'}); const first=new Date(y,m,1), start=new Date(first); start.setDate(1-first.getDay()); for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=d.toISOString().slice(0,10);const day=document.createElement('div');day.className='day '+(d.getMonth()!==m?'out':'');day.innerHTML='<div class="day-num">'+d.getDate()+'</div>';things.filter(t=>!t.hidden&&!t.done&&t.date===iso&&thingStack(t)===activeCategory).slice(0,4).forEach(()=>{const dot=document.createElement('div');dot.className='dot';day.appendChild(dot)});grid.appendChild(day)}}
  function addPill(parent,text){const pill=document.createElement('div');pill.className='pill';pill.textContent=text;parent.appendChild(pill)}
  function button(text,cls,fn){const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=text;b.onclick=fn;return b}
  function greeting(){const h=new Date().getHours();return h<12?'GOOD MORNING':h<18?'GOOD AFTERNOON':'GOOD EVENING'}
  function openEditor(t=null){ensureActiveCategory();editing=t; $('editorTitle').textContent=t?'Edit Thing':'Add Thing';renderCategoriesUI();thingText.value=t?(t.note||t.title):'';thingCategory.value=t?(t.category||activeCategory):activeCategory;thingDate.value=t?(t.date||''):'';thingImage.value=t?(t.image||''):'';thingLink.value=t?(t.link||''):'';$('hideThingBtn').style.display=t?'block':'none';$('deleteThingBtn').style.display=t?'block':'none';$('hideThingBtn').textContent=t&&t.hidden?'Unhide Thing':'Hide Thing';editorDialog.showModal();setTimeout(()=>thingText.focus(),150)}
  async function saveEditor(){const value=thingText.value.trim();if(!value){thingText.focus();return}const p=splitText(value);const data={title:p.heading,note:value,category:thingCategory.value||activeCategory,date:thingDate.value,image:thingImage.value,link:thingLink.value,timer:editing?(editing.timer||30):30,hidden:editing?!!editing.hidden:false,done:editing?!!editing.done:false,parked:editing?!!editing.parked:false,createdAt:editing?(editing.createdAt||Date.now()):Date.now()};try{if(editing){await updateThing(editing,data)}else{await addDoc(collection(db,'tasks'),data)}editorDialog.close()}catch(error){console.error(error);alert('Could not save. Check your Firestore rules allow writes to tasks.')}}
  function attachSwipe(t){let x=0,y=0;const card=$('focusCard');if(!card)return;card.addEventListener('touchstart',e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});card.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*1.4){moveThing(dx>0?1:-1)}},{passive:true})}
  function makeTicks(){timerTicks.innerHTML='';for(let i=0;i<48;i++){const tick=document.createElement('div');tick.className=i%12===0?'tick major':'tick';tick.style.height=i%6===0?'24px':'14px';tick.style.transform='translate(-50%,-50%) rotate('+(i*7.5)+'deg) translateY(-154px)';timerTicks.appendChild(tick)}}
  function setTimerMinutes(mins){let v=Math.round(Number(mins)/5)*5;if(v<0)v=0;if(v>120)v=120;if(v!==selectedMinutes)playTick();selectedMinutes=v;timerValue.textContent=v;timerEndText.textContent='Ends in '+v+' min';timerTicks.style.transform='rotate('+(v*3)+'deg)'}
  function dialMinutes(e){const r=timerRing.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let a=Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI+90;if(a<0)a+=360;return a/360*120}
  function enableDial(){let drag=false;timerRing.addEventListener('pointerdown',e=>{initAudio();drag=true;timerRing.setPointerCapture(e.pointerId);setTimerMinutes(dialMinutes(e))});timerRing.addEventListener('pointermove',e=>{if(drag)setTimerMinutes(dialMinutes(e))});timerRing.addEventListener('pointerup',e=>{drag=false;try{timerRing.releasePointerCapture(e.pointerId)}catch(_){}})}
  function openTimer(t){selectedThing=t;setTimerMinutes(t.timer||30);timerDialog.showModal()}
  function startTimer(title,mins){if(!mins)mins=5;timerTitle=title||'Focus';timerEnd=Date.now()+mins*60000;localStorage.setItem('omtTimerEnd',timerEnd);localStorage.setItem('omtTimerTitle',timerTitle);timerDialog.close();timerLock.style.display='grid';startTimerLoop()}
  function startTimerLoop(){if(timerInterval)clearInterval(timerInterval);function tick(){const rem=timerEnd-Date.now();if(!timerEnd||rem<=0){const had=!!timerEnd;timerEnd=0;localStorage.removeItem('omtTimerEnd');localStorage.removeItem('omtTimerTitle');timerLock.style.display='none';clearInterval(timerInterval);if(had){playDone();setTimeout(()=>alert('Timer complete'),250)}return}lockTime.textContent=formatTime(rem);lockTask.textContent=timerTitle;timerLock.style.display='grid'}tick();timerInterval=setInterval(tick,1000)}
  function initAudio(){if(!audioContext){try{audioContext=new (window.AudioContext||window.webkitAudioContext)()}catch(_){audioContext=null}}if(audioContext&&audioContext.state==='suspended')audioContext.resume()}
  function playTick(){if(!audioContext||Date.now()-lastTick<45)return;lastTick=Date.now();const now=audioContext.currentTime,osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.frequency.setValueAtTime(880,now);osc.frequency.exponentialRampToValueAtTime(1320,now+.025);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.04,now+.006);gain.gain.exponentialRampToValueAtTime(.0001,now+.045);osc.connect(gain);gain.connect(audioContext.destination);osc.start(now);osc.stop(now+.05)}
  function playDone(){initAudio();if(!audioContext)return;const now=audioContext.currentTime;[523,659,784,1046].forEach((f,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain();o.type=i===3?'triangle':'sine';o.frequency.setValueAtTime(f,now+i*.13);g.gain.setValueAtTime(.0001,now+i*.13);g.gain.exponentialRampToValueAtTime(.1,now+i*.13+.025);g.gain.exponentialRampToValueAtTime(.0001,now+i*.13+.32);o.connect(g);g.connect(audioContext.destination);o.start(now+i*.13);o.stop(now+i*.13+.34)})}
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());$('addBtn').onclick=()=>openEditor();$('libraryBtn').onclick=()=>{renderLibrary();libraryDialog.showModal()};$('calendarBtn').onclick=()=>{renderCalendar();calendarDialog.showModal()};$('categoriesBtn').onclick=()=>categoriesDialog.showModal();$('saveThingBtn').onclick=saveEditor;document.getElementById('editorForm').addEventListener('submit',e=>{e.preventDefault();saveEditor()});thingText.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();saveEditor()}});$('hideThingBtn').onclick=async()=>{if(editing){await updateThing(editing,{hidden:!editing.hidden});editorDialog.close()}};$('deleteThingBtn').onclick=async()=>{if(editing&&confirm('Delete this thing?')){await deleteThing(editing);editorDialog.close()}};$('addCategoryBtn').onclick=async()=>{const name=$('newCategoryInput').value.trim().toUpperCase();if(!name)return;try{await setDoc(doc(db,'categories',name),{name,createdAt:Date.now()},{merge:true});activeCategory=name;$('newCategoryInput').value=''}catch(error){console.error(error);alert('Could not add stack. Check your Firestore rules allow writes to categories.')}};$('prevMonthBtn').onclick=()=>{monthCursor.setMonth(monthCursor.getMonth()-1);renderCalendar()};$('nextMonthBtn').onclick=()=>{monthCursor.setMonth(monthCursor.getMonth()+1);renderCalendar()};$('closeTimerBtn').onclick=()=>timerDialog.close();$('startTimerBtn').onclick=()=>{if(selectedThing){updateThing(selectedThing,{timer:selectedMinutes});startTimer(selectedThing.title,selectedMinutes)}};document.addEventListener('keydown',e=>{if(e.key==='Enter'&&editorDialog.open&&!e.shiftKey){e.preventDefault();saveEditor()} if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&!editorDialog.open&&!timerDialog.open&&!calendarDialog.open&&!libraryDialog.open){if(currentThing()){e.preventDefault();moveThing(e.key==='ArrowRight'?1:-1)}}});
  makeTicks();enableDial();if(timerEnd>Date.now())startTimerLoop();
</script>
